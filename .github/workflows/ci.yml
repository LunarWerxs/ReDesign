name: CI

on:
  push:
    branches: [main]
  pull_request:

  # Manual runs, so a commit can be verified without a dummy push. Added 2026-08-06 during a
  # GitHub Actions incident whose recovery plan was to throttle webhook triggers: pushes landed on
  # main and produced no run at all, leaving nothing to gate a release on.
  workflow_dispatch:

jobs:
  daemon:
    name: daemon (test + typecheck)
    # The shipped artifact is a per-OS `bun --compile` binary, so run the suite on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # pin so a Bun upgrade can't silently change the build
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Biome. Configured since the repo started but never gated on until 2026-08-09, so a lint
      # regression could land on main unnoticed. Linux only: the rules are platform-independent and
      # running it three times just to see the same output is wasted matrix minutes.
      - if: runner.os == 'Linux'
        run: bun run lint
      # Repo guardrail (ported from AgentHydra's architect): fails if a test OR a lifecycle hook
      # reaches a subprocess while inheriting bun's 5s default timeout. Such a case measures the
      # runner, not its own assertions, and a cold windows-latest box runs this class ~10x slower
      # than a dev machine. This repo lost its Windows leg to exactly that on 2026-08-12: the
      # tray-launcher beforeAll regenerates a .lnk through PowerShell + COM, 0.35s locally, 5057ms
      # there. Linux only: the rule reads source, so running it three times says the same thing.
      - if: runner.os == 'Linux'
        run: bun run check:spawntimeout
      - run: bun test tests
        env:
          MOCK: "1" # keep the suite fully offline, no provider API keys/quota spent in CI

  web:
    name: web (i18n + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      # `build` does NOT type-check (it is check:i18n + vite build, and vite strips types without
      # checking them), so vue-tsc needs its own step. Covers src/ and the test/ specs.
      - run: npm run typecheck
      - run: npm run test # Vitest: pure-lib units + component render (no backend needed)
      - run: npm run build # vite bundle (build script runs check:i18n first)
