schema: hydra-rsi/1
# Committed bytes of the product source (Bun server/CLI + Vue web app under src/, without tests or config).
# Smaller shipped code means a lighter download and less to parse and maintain.
metrics:
  - id: product.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
