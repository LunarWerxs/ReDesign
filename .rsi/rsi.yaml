schema: hydra-rsi/1
# Committed bytes of the product source compiled into the release binary (Bun server/CLI + seed config JSON
# + Vue web app under src/, without tests, dev scripts or build/tool config).
# Smaller shipped code means a lighter download and less to parse and maintain. The binary is minified,
# so only removed code is a real win; trimming comments or whitespace is not.
metrics:
  - id: product.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
